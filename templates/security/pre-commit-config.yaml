# Copy to target repo root as `.pre-commit-config.yaml` and run `pre-commit install`
# Pairs with `.semgrep/rules.yaml` (copied from `templates/security/semgrep_rules.yaml`)
repos:
  - repo: local
    hooks:
      - id: semgrep-security-gate
        name: Semgrep Security Gate (Block Secrets & Injection)
        entry: semgrep --error --config .semgrep/rules.yaml
        language: system
        types_or: [python, javascript, typescript, yaml, json, bash]
        pass_filenames: true
